[project]
name = "py-vote-core"
version = "2.0.0"
description = "An implementation of various election methods, most notably the Schulze Method and Schulze STV."
authors = [
    {name = "Brad Beattie"}
]
license = {text = "GPLv3"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["library", "election"]
dependencies = [
    "python-graph[dot]>=2.0.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: GNU General Public License (GPL)",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/VoteIT/python-vote-core"
Repository = "https://github.com/VoteIT/python-vote-core.git"
Issues = "https://github.com/VoteIT/python-vote-core/issues"
Changelog = "https://github.com/VoteIT/python-vote-core/blob/main/CHANGES.md"

[dependency-groups]
dev = [
    "coverage>=7.9.0",
    "mypy>=1.15.0",
    "pytest>=8.4.0",
    "ruff>=0.11.0",
    "twine>=6.0.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["py3votecore"]

[tool.pytest.ini_options]
addopts = "--doctest-modules"
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "IGNORE_EXCEPTION_DETAIL",
    "ELLIPSIS",
]
testpaths = [
    "test_functionality",
    "test_performance",
]

[tool.coverage.run]
command_line = "-m pytest --doctest-modules"
source = ["py3votecore"]

[tool.coverage.report]
show_missing = true
skip_covered = true
skip_empty = true
exclude_also = [
    'def __repr__',
    'if self.debug:',
    'raise AssertionError',
    'raise NotImplementedError',
    'if 0:',
    'if __name__ == .__main__.:',
    'if TYPE_CHECKING:',
    'class .*\bProtocol\):',
    '@(abc\.)?abstractmethod',
]
